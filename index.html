<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Management System</title>
    <style>
      :root {
        --bg: #f4f7fb;
        --panel: #ffffff;
        --primary: #2563eb;
        --primary-dark: #1d4ed8;
        --accent: #10b981;
        --text: #1f2937;
        --muted: #6b7280;
        --border: #e5e7eb;
        --danger: #ef4444;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(135deg, #eef4ff, #f6fbff);
        color: var(--text);
      }

      .container {
        max-width: 1200px;
        margin: 32px auto;
        padding: 0 20px;
      }

      h1 {
        text-align: center;
        margin-bottom: 24px;
      }

      .grid {
        display: grid;
        grid-template-columns: 320px 1fr;
        gap: 24px;
      }

      .panel {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 16px;
        box-shadow: 0 8px 22px rgba(15, 23, 42, 0.08);
        padding: 20px;
      }

      form {
        display: grid;
        gap: 12px;
      }

      label {
        display: grid;
        gap: 6px;
        font-weight: 600;
        font-size: 14px;
      }

      input,
      select,
      button {
        border-radius: 10px;
        border: 1px solid var(--border);
        padding: 10px 12px;
        font-size: 14px;
      }

      input:focus,
      select:focus {
        outline: 2px solid rgba(37, 99, 235, 0.15);
        border-color: var(--primary);
      }

      button {
        cursor: pointer;
        font-weight: 700;
        transition: 0.2s ease;
      }

      .primary-btn {
        background: var(--primary);
        color: white;
        border-color: var(--primary);
      }

      .primary-btn:hover {
        background: var(--primary-dark);
      }

      .secondary-btn {
        background: #e0f2fe;
        color: #075985;
        border-color: #bae6fd;
      }

      .secondary-btn:hover {
        background: #bae6fd;
      }

      .search-row,
      .filter-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }

      .stats {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 12px;
        margin-top: 20px;
      }

      .stat-box {
        background: #f8fafc;
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 14px;
      }

      .stat-label {
        display: block;
        color: var(--muted);
        font-size: 12px;
        margin-bottom: 6px;
      }

      .stat-value {
        font-size: 20px;
        font-weight: bold;
      }

      .student-list {
        margin-top: 18px;
        display: grid;
        gap: 12px;
      }

      .student-card {
        border: 1px solid var(--border);
        border-left: 5px solid var(--primary);
        border-radius: 12px;
        padding: 14px 16px;
        background: #fbfdff;
      }

      .student-card h3 {
        margin: 0 0 8px;
      }

      .student-meta {
        color: var(--muted);
        font-size: 14px;
        line-height: 1.6;
      }

      .tiny {
        font-size: 12px;
        color: var(--muted);
      }

      @media (max-width: 900px) {
        .grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Student Management Dashboard</h1>

      <div class="grid">
        <aside class="panel">
          <h2>Add Student</h2>
          <form id="studentForm">
            <label>
              Name
              <input type="text" id="name" placeholder="Enter student name" required />
            </label>

            <label>
              Age
              <input type="number" id="age" placeholder="Age" min="1" required />
            </label>

            <label>
              Grade
              <select id="grade" required>
                <option value="A">A</option>
                <option value="B">B</option>
                <option value="C">C</option>
                <option value="D">D</option>
                <option value="F">F</option>
              </select>
            </label>

            <label>
              Score
              <input type="number" id="score" placeholder="Score" min="0" max="100" required />
            </label>

            <label>
              Major
              <input type="text" id="major" placeholder="Major" required />
            </label>

            <button type="submit" class="primary-btn">Add Student</button>
          </form>
        </aside>

        <main class="panel">
          <div class="search-row">
            <label>
              Search Student
              <input type="text" id="searchInput" placeholder="Search by name, ID or major" />
            </label>

            <label>
              Sort By
              <select id="sortSelect">
                <option value="score-desc">Score: High to Low</option>
                <option value="score-asc">Score: Low to High</option>
                <option value="name-asc">Name: A to Z</option>
                <option value="name-desc">Name: Z to A</option>
              </select>
            </label>
          </div>

          <div class="filter-row" style="margin-top: 12px;">
            <label>
              Grade Filter
              <select id="gradeFilter">
                <option value="all">All Grades</option>
                <option value="A">A</option>
                <option value="B">B</option>
                <option value="C">C</option>
                <option value="D">D</option>
                <option value="F">F</option>
              </select>
            </label>

            <label>
              Minimum Score
              <input type="number" id="minScore" placeholder="e.g. 90" min="0" max="100" />
            </label>
          </div>

          <div class="stats" id="stats"></div>

          <div class="student-list" id="studentList"></div>
        </main>
      </div>
    </div>

    <script src="studentManagement.js"></script>
    <script>
      const studentForm = document.getElementById("studentForm");
      const searchInput = document.getElementById("searchInput");
      const gradeFilter = document.getElementById("gradeFilter");
      const minScoreInput = document.getElementById("minScore");
      const sortSelect = document.getElementById("sortSelect");
      const studentList = document.getElementById("studentList");
      const statsBox = document.getElementById("stats");

      function renderStats() {
        const analytics = studentRegistry.getSystemAnalytics();
        const cards = [
          { label: "Total Students", value: analytics.totalStudents },
          { label: "Average Score", value: analytics.averageScore },
          { label: "Top Grade", value: Object.keys(analytics.gradeDistribution).sort((a, b) => analytics.gradeDistribution[b] - analytics.gradeDistribution[a])[0] || "N/A" }
        ];

        statsBox.innerHTML = cards
          .map(
            (card) => `
              <div class="stat-box">
                <span class="stat-label">${card.label}</span>
                <span class="stat-value">${card.value}</span>
              </div>
            `
          )
          .join("");
      }

      function getVisibleStudents() {
        let students = [...studentRegistry.students];

        const query = searchInput.value.trim().toLowerCase();
        if (query) {
          students = students.filter((student) => {
            const haystack = `${student.id} ${student.name} ${student.major}`.toLowerCase();
            return haystack.includes(query);
          });
        }

        const selectedGrade = gradeFilter.value;
        if (selectedGrade !== "all") {
          students = students.filter((student) => student.grade === selectedGrade);
        }

        const minScore = Number(minScoreInput.value);
        if (!Number.isNaN(minScore) && minScore > 0) {
          students = students.filter((student) => student.score >= minScore);
        }

        const sortValue = sortSelect.value;
        if (sortValue === "score-desc") {
          students.sort((a, b) => b.score - a.score);
        } else if (sortValue === "score-asc") {
          students.sort((a, b) => a.score - b.score);
        } else if (sortValue === "name-asc") {
          students.sort((a, b) => a.name.localeCompare(b.name));
        } else if (sortValue === "name-desc") {
          students.sort((a, b) => b.name.localeCompare(a.name));
        }

        return students;
      }

      function renderStudents() {
        const students = getVisibleStudents();

        if (!students.length) {
          studentList.innerHTML = `<div class="student-card"><h3>No students found</h3><div class="student-meta">Try adjusting your filters or search query.</div></div>`;
          return;
        }

        studentList.innerHTML = students
          .map(
            (student) => `
              <div class="student-card">
                <h3>${student.name}</h3>
                <div class="student-meta">
                  <strong>ID:</strong> ${student.id}<br />
                  <strong>Age:</strong> ${student.age}<br />
                  <strong>Grade:</strong> ${student.grade}<br />
                  <strong>Score:</strong> ${student.score}<br />
                  <strong>Major:</strong> ${student.major}
                </div>
              </div>
            `
          )
          .join("");
      }

      studentForm.addEventListener("submit", (event) => {
        event.preventDefault();

        const name = document.getElementById("name").value.trim();
        const age = Number(document.getElementById("age").value);
        const grade = document.getElementById("grade").value;
        const score = Number(document.getElementById("score").value);
        const major = document.getElementById("major").value.trim();

        if (!name || !major || Number.isNaN(age) || Number.isNaN(score)) {
          alert("Please complete all student fields correctly.");
          return;
        }

        studentRegistry.addStudent(name, age, grade, score, major);
        studentForm.reset();
        render();
      });

      [searchInput, gradeFilter, minScoreInput, sortSelect].forEach((element) => {
        element.addEventListener("input", render);
        element.addEventListener("change", render);
      });

      function render() {
        renderStats();
        renderStudents();
      }

      render();
    </script>
  </body>
</html>
